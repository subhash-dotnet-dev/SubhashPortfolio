    <!-- ═══════════════ INLINE BOOT LOADER ═══════════════ -->
    <style>
      /* Pre-React boot screen — prevents white flash */
      html, body {
        margin: 0;
        padding: 0;
        background: #050914;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      html[data-theme='light'] body { background: #f8fafc; }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #0a1224 0%, #050914 70%);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      html[data-theme='light'] #boot {
        background: radial-gradient(ellipse at center, #ffffff 0%, #f8fafc 70%);
      }
      #boot.boot-hide { opacity: 0; pointer-events: none; }

      #boot .boot-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, #3b82f6 0%, #22d3ee 50%, #8b5cf6 100%);
        box-shadow: 0 20px 60px -12px rgba(59,130,246,0.7), 0 0 60px -10px rgba(34,211,238,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -0.05em;
        animation: boot-pulse 1.4s ease-in-out infinite;
        position: relative;
        overflow: hidden;
      }
      #boot .boot-logo::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
        background-size: 200% 200%;
        animation: boot-shine 2s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes boot-shine {
        0%, 100% { background-position: 100% 100%; opacity: 0; }
        50% { background-position: 0% 0%; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Pre-React boot screen -->
    <div id="boot">
      <div class="boot-logo">SY</div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!-- Hide boot screen when React mounts -->
    <script>
      // Wait for React to render, then fade out boot
      window.addEventListener('load', () => {
        const boot = document.getElementById('boot');
        if (boot) {
          setTimeout(() => {
            boot.classList.add('boot-hide');
            setTimeout(() => boot.remove(), 500);
          }, 400);
        }
      });
      // Fallback: force hide after 4s max
      setTimeout(() => {
        const boot = document.getElementById('boot');
        if (boot) { boot.classList.add('boot-hide'); setTimeout(() => boot.remove(), 500); }
      }, 4000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
