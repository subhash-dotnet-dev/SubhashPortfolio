<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>

    <!-- Logo gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glass shine -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with glow -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)" opacity="0.3"/>

  <!-- Border ring -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="url(#logoGrad)" stroke-width="1.2" opacity="0.5"/>

  <!-- Main logo -->
  <rect x="10" y="10" width="44" height="44" rx="11" fill="url(#logoGrad)" filter="url(#glowFilter)"/>

  <!-- Inner shine -->
  <rect x="10" y="10" width="44" height="44" rx="11" fill="url(#shine)"/>

  <!-- Monogram "S" (custom path) -->
  <path d="M 32 21 Q 25 21 25 26 Q 25 30 32 31 Q 39 32 39 37 Q 39 43 32 43 Q 26 43 24 39"
        stroke="#ffffff"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#glowFilter)"/>

  <!-- Accent dot -->
  <circle cx="42" cy="42" r="4" fill="#10b981"/>
  <circle cx="42" cy="42" r="4" fill="none" stroke="#050914" stroke-width="1.2"/>
</svg>
